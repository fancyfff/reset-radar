<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Reset Radar logo">
  <!-- 透明底 + 白色线条，适配深色页面(0A0E17)；如需黑底用白色，白底用黑色 -->
  <g fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round">
    <!-- 外弧（字母 R 的圆 + 雷达外环） -->
    <circle cx="64" cy="66" r="40"/>
    <!-- 内弧/距离环 -->
    <circle cx="64" cy="66" r="24"/>
    <!-- 时间刻度：垂直上轴 -->
    <line x1="64" y1="14" x2="64" y2="34"/>
    <!-- 时间刻度：水平右轴 -->
    <line x1="86" y1="66" x2="108" y2="66"/>
  </g>
  <!-- 雷达扫描针（较粗，右上角度） -->
  <line x1="64" y1="66" x2="102" y2="76" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
  <!-- 中心焦点 -->
  <circle cx="64" cy="66" r="4.5" fill="#FFFFFF"/>
</svg>